<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Practica de listening en ingles con voz generada por el navegador, por contexto y nivel A1, B1, C1.">
  <title>Listening · StudyEnglish</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Nuestro CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Aplica el tema guardado antes de pintar, para evitar parpadeo -->
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body data-section="listening">

  <!-- CABECERA -->
  <header class="header-compact">
    <a href="index.html" class="back-link">← Volver</a>
    <button class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema claro/oscuro">🌙</button>
    <div class="badge">Learn English. Level Up!</div>
    <h1>🎧 Listening</h1>
  </header>

  <!-- El contenido se genera aquí desde script.js -->
  <main class="page-main">
    <div class="page-content" id="page-content"></div>
  </main>

  <!-- IMPORTANTE: data.js siempre antes que script.js -->
  <script src="data.js"></script>
  <script src="script.js"></script>

</body>
</html>
