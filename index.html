<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Aprende ingles gratis: gramatica, vocabulario, tests y listening organizados por nivel A1, B1 y C1.">
  <title>StudyEnglish</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Nuestro CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Aplica el tema guardado antes de pintar, para evitar parpadeo -->
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>

  <!-- CABECERA -->
  <header>
    <button class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema claro/oscuro">🌙</button>
    <div class="badge">Learn English. Level Up!</div>
    <h1>Aprende inglés<br><em>desde cero</em></h1>
    <p>Gramática, vocabulario, tests y listening en un solo lugar</p>
    <div class="streak-badge" id="streak-badge"></div>
  </header>

  <!-- Las cards se generan aquí desde script.js. Cada una es un enlace a su propia pagina -->
  <main id="cards-grid"></main>

  <!-- IMPORTANTE: data.js siempre antes que script.js -->
  <script src="data.js"></script>
  <script src="script.js"></script>

</body>
</html>
